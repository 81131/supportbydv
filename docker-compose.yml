services:
  db:
    image: postgres:15-alpine
    container_name: supportbydv-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5



  backend:
    build:
      context: ./backend
    container_name: supportbydv-backend
    restart: always
    env_file:
      - .env
    # Port 8000 is NOT exposed to the host — all traffic flows through nginx.
    # This enforces that CSRF/cookie checks can't be bypassed via direct API access.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: supportbydv-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
