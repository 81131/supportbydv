server {
    listen 80;
    server_name _;  # Match any hostname, not just localhost

    root /usr/share/nginx/html;
    index index.html;

    # --- API Proxy ---
    # All /api/ requests are forwarded to the backend container.
    # The trailing slash in proxy_pass strips the /api prefix, so
    # a request to /api/modules becomes /modules on the backend.
    location /api/ {
        proxy_pass         http://backend:8000/;
        # Rewrite backend redirect URLs so they keep the /api/ prefix.
        # Without this, FastAPI's trailing-slash 307 redirects go to
        # /quizzes/ instead of /api/quizzes/, landing on nginx's static
        # handler which returns 405 for POST/PUT/DELETE.
        proxy_redirect     http://backend:8000/ /api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for large file uploads (notes/images)
        client_max_body_size 50M;
        proxy_read_timeout   300s;
    }

    # --- Static files proxy (badge images, note uploads, module banners) ---
    location /static/ {
        proxy_pass         http://backend:8000/static/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        expires            1d;
        add_header         Cache-Control "public";
    }

    # --- SPA Fallback ---
    # Everything else is served from the built React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}