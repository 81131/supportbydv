server {
    listen 80;
    server_name _;  # Match any hostname, not just localhost

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # same-origin-allow-popups: lets Google's OAuth popup postMessage back
    # to the parent tab without being blocked by the browser's COOP policy.
    add_header Cross-Origin-Opener-Policy  "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none"             always;
    add_header X-Frame-Options             "SAMEORIGIN"               always;
    add_header X-Content-Type-Options      "nosniff"                  always;

    # --- API Proxy ---
    # All /api/ requests are forwarded to the backend container.
    # The trailing slash in proxy_pass strips the /api prefix, so
    # a request to /api/modules becomes /modules on the backend.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_redirect     http://backend:8000/ /api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Upload-specific settings ─────────────────────────────────────────
        client_max_body_size    50M;
        # Stream body to backend immediately — don't buffer the whole file in nginx
        proxy_request_buffering off;
        # How long nginx waits to read a response from the backend (e.g. while R2 upload happens)
        proxy_read_timeout      600s;
        # How long nginx waits between writes when sending body to backend
        proxy_send_timeout      600s;
        # How long between data packets from the browser during upload
        client_body_timeout     600s;
    }

    # --- Static files proxy (badge images, note uploads, module banners) ---
    location /static/ {
        proxy_pass         http://backend:8000/static/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        expires            1d;
        add_header         Cache-Control "public";
    }

    # --- SPA Fallback ---
    # Everything else is served from the built React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}