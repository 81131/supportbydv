server {
    listen 80;
    server_name supportbydv.com www.supportbydv.com; # <--- ACTUAL DOMAIN

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name supportbydv.com www.supportbydv.com; # <--- ACTUAL DOMAIN

    # SSL Certificate Paths (Certbot will create these)
    ssl_certificate     /etc/letsencrypt/live/supportbydv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supportbydv.com/privkey.pem;

    # Modern SSL Settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # same-origin-allow-popups: lets Google's OAuth popup postMessage back
    # to the parent tab without being blocked by the browser's COOP policy.
    add_header Cross-Origin-Opener-Policy  "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none"             always;
    add_header X-Frame-Options             "SAMEORIGIN"               always;
    add_header X-Content-Type-Options      "nosniff"                  always;

    # Explicitly handle static files requested via /api/static/
    location /api/static/ {
        proxy_pass         http://backend:8000/static/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            1d;
        add_header         Cache-Control "public";
    }

    # --- API Proxy ---
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_redirect     http://backend:8000/ /api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Upload-specific settings ─────────────────────────────────────────
        client_max_body_size    50M;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        client_body_timeout     600s;
    }

    # --- Static files proxy (badge images, note uploads, module banners) ---
    location /static/ {
        proxy_pass         http://backend:8000/static/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        expires            1d;
        add_header         Cache-Control "public";
    }

    # --- SPA Fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}